<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame &amp; Fork — flagship call: The Meeting You Earned</title>
<style>
  /* ===== Frame & Fork tokens — verbatim from BrandColors.swift / Assets.xcassets ===== */
  :root{
    --bg-page:#262421; --bg-panel:#312E2B; --bg-rail:#272522; --bg-banner:#21201D;
    --border:#1B1A19; --border-strong:#3D3A37;
    --green:#81B64C; --green-deep:#71A73F; --green-hover:#9CC868;
    --text:#FFFFFF; --text2:#C9C8C5; --muted:#9B9893; --faint:#6F6D6A;
    --danger:#A4262C; --danger-text:#E5484D; --warning:#E5A50A; --info:#3692E7;
    --fork:#4FB8B0; --sharp:#5C8CF0;
  }
  *{box-sizing:border-box; margin:0}
  html{background:var(--bg-page);}
  body{position:relative; background:var(--bg-page); color:var(--text);
    font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:26px 16px 90px; min-height:100vh;}
  .disp{font-family:ui-rounded,system-ui,-apple-system,sans-serif; font-weight:800;}
  .micro{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--muted);}

  .titlebar{width:min(560px,100%); margin-bottom:14px;}
  .titlebar h1{font-size:22px;} .titlebar .micro{margin-top:3px;}

  .call{width:min(560px,100%); background:var(--bg-rail); border:1px solid var(--border-strong);
    border-radius:16px; overflow:hidden;}
  .callhead{background:var(--bg-banner); padding:12px 16px; display:flex; justify-content:space-between;
    align-items:center; border-bottom:1px solid var(--border-strong);}
  .callhead .who{font-size:14px; font-weight:700;}
  .callhead .who small{display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-top:1px;}
  .live{font-size:11px; font-weight:700; letter-spacing:.6px; color:var(--green); }
  .live::before{content:"●"; margin-right:5px; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .feed{padding:16px 14px 22px; display:flex; flex-direction:column; gap:9px;}
  .turn{max-width:88%; padding:10px 13px; border-radius:14px; font-size:14.5px; line-height:1.48;}
  .buyer{background:var(--bg-panel); border:1px solid var(--border-strong); border-bottom-left-radius:4px; align-self:flex-start; color:var(--text2);}
  .rep{background:rgba(129,182,76,.13); border:1px solid rgba(129,182,76,.4); border-bottom-right-radius:4px; align-self:flex-end;}
  .who-tag{display:block; font-size:10px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--faint); margin-bottom:3px;}
  .rep .who-tag{color:var(--green-deep);}
  .beat{align-self:center; font-size:12px; color:var(--faint); font-style:italic; padding:2px 0;}
  .fade{animation:fadeup .4s ease both;}
  @keyframes fadeup{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
  .intent{display:none; margin:2px 0 2px 10px; max-width:82%; align-self:flex-start;
    border-left:2px solid var(--fork); padding:5px 10px; font-size:12px; font-style:italic; color:var(--fork); line-height:1.4;}
  .director .intent{display:block;}

  .ask{padding:2px 16px 6px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--green);}
  .opts{display:flex; flex-direction:column; gap:8px; padding:0 14px 18px;}
  .opt{background:var(--bg-panel); border:1.5px solid var(--border-strong); border-radius:12px;
    padding:11px 13px; font-size:14px; line-height:1.45; text-align:left; cursor:pointer;
    font-family:inherit; color:var(--text2); transition:border-color .15s, transform .1s;}
  .opt:hover{border-color:var(--green); color:var(--text); transform:translateY(-1px);}
  .opt:disabled{opacity:.4; cursor:default; transform:none;}
  .opt.hold{font-style:italic; color:var(--muted);}
  .tapnote{padding:0 16px 8px; font-size:12px; color:var(--faint); font-style:italic;}
  .markable .turn.tappable{cursor:pointer;}
  .markable .turn.tappable:hover{box-shadow:0 0 0 2px var(--green);}

  .typerfirst{margin:0 14px 10px; border:1px dashed var(--border-strong); border-radius:12px; padding:10px 12px;}
  .typerfirst summary{font-size:12px; color:var(--muted); cursor:pointer; font-weight:600;}
  .typerfirst textarea{width:100%; margin-top:8px; min-height:58px; background:var(--bg-banner); color:var(--text);
    border:1px solid var(--border-strong); border-radius:10px; padding:9px 11px; font:inherit; font-size:13.5px; resize:vertical;}
  .typerfirst textarea:focus{outline:1.5px solid var(--green);}
  .typerfirst .commit{margin-top:8px; background:var(--green-deep); color:#fff; border:none; border-radius:9px;
    padding:7px 14px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:inherit;}
  .yourline{align-self:flex-end; max-width:88%; margin:0 0 2px; font-size:11.5px; color:var(--faint); font-style:italic;}

  .endcard{margin:8px 14px 18px; background:var(--bg-banner); border:1px solid var(--border-strong);
    border-radius:14px; padding:16px; text-align:center;}
  .endcard .e-title{font-size:20px;}
  .endcard .e-sub{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5;}
  /* confirm chip (mark two-stage) */
  .confirm{display:flex; gap:8px; margin:4px 0 4px 12px; align-self:flex-start;}
  .confirm button{border:1.5px solid var(--border-strong); background:var(--bg-panel); color:var(--text2);
    border-radius:9px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
  .confirm .go{border-color:var(--green); color:var(--green-hover);}
  .provisional{box-shadow:0 0 0 2px var(--green) !important;}
  /* detector read chip */
  .readchip{align-self:flex-end; max-width:86%; margin:2px 0 4px; border-right:2px solid var(--info);
    padding:6px 10px; font-size:12px; color:var(--info); line-height:1.4; text-align:right;}
  /* sound toggle */
  .sndbtn{background:none; border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:99px;
    font-size:10.5px; font-weight:700; letter-spacing:.07em; padding:3px 9px; cursor:pointer; font-family:inherit; margin-right:8px;}
  .sndbtn.off{opacity:.5;}
  /* verdict landing choreography */
  .rb-node{opacity:0; transform:translateY(8px); transition:opacity .28s ease, transform .28s ease;}
  .rb-node.landed{opacity:1; transform:none;}
  .rb-node.land-heavy{transition-duration:.45s;}
  .rb-node.land-heavy.landed{transform:translateY(2px);}
  .endcard .e-title{display:inline-block;}
  .fork-anticipation .e-title{opacity:0;}
  .fork-anticipation .bar-cue{height:3px; width:40%; margin:10px auto 0; border-radius:99px;
    background:linear-gradient(90deg,transparent,var(--fork),transparent); animation:cue 0.45s ease-in forwards;}
  @keyframes cue{from{opacity:0; transform:scaleX(.4)}to{opacity:1; transform:scaleX(1)}}
  .fork-land .e-title{opacity:1; animation:forkland .5s cubic-bezier(0.16,1,0.3,1) both;}
  @keyframes forkland{from{transform:scale(1.22); opacity:0}to{transform:scale(1); opacity:1}}
  .front-hi{transition:background .4s; background:rgba(79,184,176,.22); border-radius:4px;}
  .endcard-heavy{animation:heavysettle .42s ease-out both;}
  @keyframes heavysettle{from{opacity:0; transform:translateY(-5px)}60%{opacity:1}to{opacity:1; transform:translateY(2px)}}
  .e-teach{font-size:12px; color:var(--faint); margin-top:9px; line-height:1.45; opacity:0; transition:opacity .5s;}
  .e-teach.shown{opacity:1;}
  .rb-read{margin-top:7px; font-size:12.5px; color:var(--info); line-height:1.45;}
  .rb-read::before{content:"YOUR TYPED LINE READ · "; font-size:10px; letter-spacing:.6px; color:var(--faint); font-weight:700;}
  @media (prefers-reduced-motion: reduce){ .endcard-heavy{animation:none} .e-teach{transition:none} }
  @media (prefers-reduced-motion: reduce){
    .rb-node{opacity:1; transform:none; transition:none;}
    .fork-anticipation .e-title,.fork-land .e-title{opacity:1; animation:none;}
    .fork-anticipation .bar-cue{animation:none; opacity:0;}
  }
  .rb-btn{margin-top:12px; background:var(--green); color:#1d2513; border:none; border-radius:11px;
    padding:11px 22px; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit;}
  .rb-btn:hover{background:var(--green-hover);}

  /* ===== Read-Back ===== */
  .readback{width:min(560px,100%); margin-top:20px; display:none;}
  .rb-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .rb-head h2{font-size:19px;}
  .toggle{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none;}
  .toggle .sw{width:34px; height:20px; border-radius:99px; background:var(--border-strong); position:relative; transition:background .2s;}
  .toggle .sw::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text2); transition:left .2s;}
  .toggle.on .sw{background:var(--fork);}
  .toggle.on .sw::after{left:16px; background:#fff;}
  .spark{background:var(--bg-rail); border:1px solid var(--border-strong); border-radius:14px; padding:12px 14px 8px; margin-bottom:12px;}
  .spark svg{width:100%; height:64px; display:block;}
  .rb-node{background:var(--bg-rail); border:1px solid var(--border-strong); border-radius:14px; padding:14px; margin-bottom:10px;}
  .rb-top{display:flex; align-items:center; gap:10px;}
  .v-chip{min-width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:800; color:#fff; padding:0 8px;}
  .rb-label{font-size:15px;}
  .rb-beatname{font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.7px; font-weight:600;}
  .rb-yours{font-size:13px; color:var(--text2); margin-top:9px; line-height:1.45;}
  .rb-yours b{color:var(--text); font-weight:600;}
  .rb-room{margin-top:8px; font-size:12.5px; color:var(--warning); line-height:1.45;}
  .rb-room::before{content:"THE ROOM WAS TELLING YOU · "; font-size:10px; letter-spacing:.6px; color:var(--faint); font-weight:700;}
  .rb-master{margin-top:8px; font-size:13px; color:var(--green-hover); line-height:1.45;}
  .rb-master::before{content:"MASTER LINE · "; font-size:10px; letter-spacing:.6px; color:var(--green-deep); font-weight:700;}
  .rb-branches{margin-top:9px;}
  .rb-branches summary{font-size:12px; color:var(--info); cursor:pointer; font-weight:600;}
  .rb-branch{margin:7px 0 0 8px; padding:7px 10px; border-left:2px solid var(--border-strong); font-size:12.5px; color:var(--muted); line-height:1.45;}
  .rb-branch b{color:var(--text2); font-weight:600;}
  .fork-hero{background:linear-gradient(160deg, rgba(79,184,176,.16), var(--bg-rail)); border-color:var(--fork);}
  @media (prefers-reduced-motion: reduce){ .fade{animation:none} .live::before{animation:none} }
</style>
</head>
<body>

<div class="titlebar">
  <h1 class="disp">The Meeting You Earned</h1>
  <div class="micro">Long game · 5 decisions · Corvid Logistics · verdicts arrive after the call, not during</div>
</div>

<div class="call">
  <div class="callhead">
    <div class="who">Priya Nair &amp; Tom Okafor<small>Ops Director · VP Ops — Corvid Logistics</small></div>
    <div><button class="sndbtn" id="sndBtn" aria-label="toggle sound">SOUND ON</button><span class="live">LIVE</span></div>
  </div>
  <div class="feed" id="feed"></div>
  <div id="stagearea"></div>
</div>

<section class="readback" id="readback">
  <div class="rb-head">
    <h2 class="disp">Read-Back</h2>
    <div class="toggle" id="dirToggle"><span>Director's layer</span><span class="sw"></span></div>
  </div>
  <div class="spark"><div class="micro" style="margin-bottom:6px">Deal trajectory</div><svg id="sparksvg" viewBox="0 0 300 64" preserveAspectRatio="none"></svg></div>
  <div id="rbNodes"></div>
</section>

<script>
/* ================= Verdict vocab — mirrors Models/Verdict.swift exactly ================= */
const V = {
  fork:  {g:'‼',  label:'The Fork', c:'#4FB8B0'},
  sharp: {g:'!',  label:'Sharp',    c:'#5C8CF0'},
  best:  {g:'◆',  label:'Best',     c:'#71A73F'},
  solid: {g:'✓',  label:'Solid',    c:'#81B64C'},
  fine:  {g:'·',  label:'Fine',     c:'rgba(129,182,76,.7)'},
  loose: {g:'?!', label:'Loose',    c:'#E5A50A'},
  slip:  {g:'?',  label:'Slip',     c:'#E5A50A'},
  missed:{g:'✕',  label:'Missed',   c:'#9B9893'},
  tell:  {g:'??', label:'Tell',     c:'#A4262C'},
};
function verdictFrom(ev, isBest, isFork){ // same bands as Verdict.from
  if(isBest) return isFork ? 'fork' : 'best';
  if(ev>=0.30) return 'solid'; if(ev>=-0.15) return 'fine';
  if(ev>=-0.50) return 'loose'; if(ev>=-1.00) return 'slip'; return 'tell';
}

/* ================= The call ================= */
const feed=document.getElementById('feed'), stage=document.getElementById('stagearea');
const S={temp:0, flags:{}, record:[], evs:[]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function bubble(kind, who, text, intent){
  const wrap=document.createDocumentFragment();
  const t=document.createElement('div'); t.className='turn '+kind+' fade';
  t.innerHTML='<span class="who-tag">'+who+'</span>'+text; wrap.appendChild(t);
  if(intent){ const n=document.createElement('div'); n.className='intent fade'; n.textContent='» '+intent; wrap.appendChild(n); }
  feed.appendChild(wrap); t.scrollIntoView({block:'nearest',behavior:'smooth'}); return t;
}
function beat(text){ const b=document.createElement('div'); b.className='beat fade'; b.textContent=text; feed.appendChild(b); }

/* ===== ToneKit — JUICE-DOCTRINE §4: sine, warm, quiet; magnitude = duration + low octave +
   chord richness, never loudness. Routine is the protected noise floor. ===== */
const ToneKit=(()=>{
  let ctx=null, enabled=(localStorage.getItem('ff:snd')??'1')==='1';
  const ensure=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; };
  function note(freq, t0, dur, gain, type='sine'){
    const c=ensure(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0+0.012);           // fast attack
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);      // percussive decay ("reverb" tail)
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }
  const play={
    tick(){    const c=ensure(); if(!c||!enabled) return; note(500,c.currentTime,0.06,0.025); },
    routine(){ const c=ensure(); if(!c||!enabled) return; note(420,c.currentTime,0.12,0.05); },
    best(){    const c=ensure(); if(!c||!enabled) return; const t=c.currentTime;
               note(420,t,0.07,0.05); note(529,t+0.055,0.12,0.055); },                 // resolve up a major third
    sharp(){   const c=ensure(); if(!c||!enabled) return; const t=c.currentTime;
               note(440,t,0.08,0.05); note(660,t+0.07,0.16,0.055); },                  // ascending fifth
    off(){     const c=ensure(); if(!c||!enabled) return; const t=c.currentTime;
               note(480,t,0.07,0.045); note(430,t+0.06,0.10,0.04); },                  // short dry descent
    tell(){    const c=ensure(); if(!c||!enabled) return; const t=c.currentTime;
               note(220,t,0.14,0.06); note(175,t+0.11,0.25,0.06); note(110,t+0.11,0.30,0.045); }, // heavy, not loud
    fork(){    const c=ensure(); if(!c||!enabled) return; const t=c.currentTime;
               [392,494,587].forEach(f=>note(f,t,0.42,0.045));                          // full major triad
               note(196,t,0.55,0.04);                                                   // low-octave body
               note(784,t+0.10,0.60,0.03); },                                           // raised top note
  };
  const forVerdict=vk=>({fork:play.fork, sharp:play.sharp, best:play.best,
    solid:play.routine, fine:play.routine, loose:play.off, slip:play.off,
    missed:play.off, tell:play.tell}[vk]||play.routine);
  return { play, forVerdict,
    get enabled(){return enabled;},
    toggle(){ enabled=!enabled; localStorage.setItem('ff:snd', enabled?'1':'0'); return enabled; } };
})();
(function(){
  const b=document.getElementById('sndBtn');
  const paint=()=>{ b.textContent=ToneKit.enabled?'SOUND ON':'SOUND OFF'; b.classList.toggle('off',!ToneKit.enabled); };
  b.onclick=()=>{ ToneKit.toggle(); paint(); }; paint();
  document.addEventListener('pointerdown',()=>{ try{ ToneKit.play.tick(); }catch(e){} },{once:true}); // gesture unlock + first tick
})();

/* ===== DetectorLocal (prototype port) — classifies the typed line per beat, before options ===== */
const DETECTORS={
 'The open':l=>{
   if(/skip|no deck|fall apart|what did|what have|where do|which/.test(l)&&/\?/.test(l)) return ['ADVANCES','You dropped the performance and handed her the floor — her fragments are about to start.'];
   if(/deck|slides|walk you through|quick/.test(l)) return ['PERFORMS','A deck answer to a person who told you the clock is a test. Watch her thumb.'];
   if(/congratul|board|initiative|read|research/.test(l)) return ['FLATTERS','Research-flexing reads as rehearsed here — fourth vendor this month to open that way.'];
   return ['UNCLEAR','Neither a move nor a question. In the room this is throat-clearing.'];},
 'The number':l=>{
   if(/\d/.test(l)&&/site|spoke|hub|per/.test(l)) return ['ANSWERS STRAIGHT','A number she can write down and defend upstairs. That is the whole test.'];
   if(/depends|scope|map|proper|build you/.test(l)) return ['HEDGES','That is — word for word — the category answer. She has heard it twice this month.'];
   if(/roi|case|context|first/.test(l)) return ['DELAYS','Real number was the ask; she will let it pass and ask again, on her clock.'];
   return ['UNCLEAR','She asked for one number. Whatever this is, it is not one number.'];},
 'The close':l=>{
   if(/thursday|monday|tuesday|wednesday|friday|calendar|thirty|30 min|both|owner/.test(l)) return ['BANKS THE DATE','Concrete time, named people. The meeting compounds instead of evaporating.'];
   if(/marcus/.test(l)) return ['COVERS THE FLANK','You heard the stammer. Coverage bought — check what it cost the calendar.'];
   if(/summary|send|write up|recap|email/.test(l)) return ['DEFERS','A document where a date should be. That shelf has a deck on it already.'];
   if(/sign|quarter|close|contract/.test(l)) return ['PRESSES','Your quarter is not her problem — and she will say so.'];
   return ['UNCLEAR','She asked what you need. Name a thing or lose the handoff.'];}
};
async function say(turns){ for(const t of turns){
  if(t.k==='beatline'){ beat(t.x); await sleep(650); continue; }
  bubble(t.k,t.w,t.x,t.i); await sleep(t.d??1050);} }

/* Every buyer turn: x = surface, i = director's intent (hidden until Read-Back toggle) */
const CALL=[
/* ── N1 · OPEN (pick) ─────────────────────────────── */
{ beatname:'The open', type:'pick',
  lead:[
    {k:'buyer', w:'Priya', x:'You’ve got till quarter past. Tom says you don’t waste time — he says that about everyone, so.', d:1200,
     i:'Testing, not hostile. She discounts Tom’s endorsement out loud so you can’t lean on it. Whatever you planned to open with, she just made it stale.'},
  ],
  ask:'Open.',
  options:[
    {t:'"Then I’ll keep it tight — the deck’s twelve slides, I’ll hit the four that matter."', ev:-0.9, scar:'deckWalked',
     cont:[{k:'rep',w:'You',x:'Then I’ll keep it tight — the deck’s twelve slides, I’ll hit the four that matter.'},
           {k:'buyer',w:'Priya',x:'Mm-hm.', d:800, i:'Fluent politeness incoming. With Priya, short and blunt means engaged — this little “mm-hm” is her leaving.'},
           {k:'beatline',x:'her thumb moves to her phone, once'}],
     room:'The "mm-hm" and the phone. Clipped Priya is engaged Priya; polite Priya is already gone.'},
    {t:'"Then no deck. Where do these pitches usually fall apart for you?"', ev:1, best:true,
     cont:[{k:'rep',w:'You',x:'Then no deck. Where do these pitches usually fall apart for you?'},
           {k:'buyer',w:'Priya',x:'Pricing. Always pricing. Nobody prices hub-and-spoke straight.', d:1100,
            i:'Fragments. With her that’s the good sign — she’s stopped performing and started working. She also just handed you the agenda.'},
           {k:'beatline',x:'she puts the phone face-down'}],
     room:'Sentence fragments and the phone going face-down. She works in fragments; she stalls in paragraphs.'},
    {t:'"Appreciate you making time — I know ops visibility’s been on your plate since it hit the board deck."', ev:-0.3,
     cont:[{k:'rep',w:'You',x:'Appreciate you making time — I know ops visibility’s been on your plate since it hit the board deck.'},
           {k:'buyer',w:'Priya',x:'It has, yes, and I’m sure you’ve read our filings very thoroughly. What have you got.', d:1150,
            i:'Research-flexing reads as rehearsed to her — she’s seen four decks this month and every one opened this way. Note the full, polite sentences: distance.'}],
     room:'The fuller her sentences get, the further away she is. That was a doorman answer.'}
  ],
  master:1
},
/* ── N2 · THE NUMBER (pick) ─────────────────────────── */
{ beatname:'The number', type:'pick',
  lead:[
    {k:'buyer', w:'Priya', x:'So price it. Nine hubs, forty-one spokes. A real number — the range game is why the last vendor’s deck is still “under review.”', d:1300,
     i:'The exact count is a test with a tripwire: she knows her own network cold and wants to see if you’ll pretend to. “Under review” = where decks go to die at Corvid; she’s telling you the stakes.'},
  ],
  ask:'She wants the number.',
  scarcheck: s=> s.flags.deckWalked ? [{k:'buyer',w:'Priya',x:'This is slide four, isn’t it.', d:900, i:'The scar. She clocked the deck moment and hasn’t forgiven it — you’re pitching uphill now.'}] : null,
  options:[
    {t:'"At your count you’d land around three-ten a site. It steps down at sixty spokes — I’d rather show you the cliff now than surprise you at renewal."', ev:1, best:true, flag:'straightNumber',
     cont:[{k:'rep',w:'You',x:'At your count you’d land around three-ten a site. It steps down at sixty spokes — I’d rather show you the cliff now than surprise you at renewal.'},
           {k:'beatline',x:'she writes something down'},

/* ================= endings ================= */
function ending(){
  const f=S.flags, perfect = f.straightNumber && f.caughtMigration && f.heldSidebar && S.lastBestForkable;
  if(perfect) return {v:'fork', title:'‼ The Fork', cls:'fork-hero',
    sub:'One agenda line — "March-actual, not March-official" — <span class="f1">banked her respect</span> AND <span class="f2">put the real date on the calendar</span>.',
    teach:'A concession was never needed: skipping your own deck at the open was the concession, and it just won on two fronts. This verdict is rare by design.'};
  if(S.temp>=2) return {v:'best', title:'◆ Next Step Booked', cls:'',
    sub:'Thursday exists, both threads are alive, and the number held. Read the call back — one line was available that would have made it art.'};
  if(S.temp>=0) return {v:'fine', title:'· Deck Limbo', cls:'',
    sub:'Nobody said no. Nothing has a date. Somewhere at Corvid there is a shelf, and your summary is about to join the last vendor’s deck on it.'};
  return {v:'tell', title:'?? Parked', cls:'',
    sub:'Priya’s attention was available exactly once. The read-back below shows the three places it left.'};
}

/* ================= runtime ================= */
let nodeIdx=0;
async function runNode(){
  const n=CALL[nodeIdx];
  if(!n){ return finish(); }
  if(n.scarcheck){ const sc=n.scarcheck(S); if(sc){ await say(sc); n._scarShown=sc; } }
  if(n.intro) for(const b of n.intro){ beat(b.x); await sleep(500); }
  if(n.lead) await say(n.lead);
  if(n.type==='mark') return renderMark(n);
  renderPick(n);
}
function typerFirst(container, n){
  const d=document.createElement('details'); d.className='typerfirst';
  d.innerHTML='<summary>say it yourself first (optional)</summary><textarea placeholder="your line, before you see any options…"></textarea><button class="commit">Commit line</button>';
  d.querySelector('.commit').onclick=()=>{
    const v=d.querySelector('textarea').value.trim(); if(!v) return;
    ToneKit.play.tick();
    const y=document.createElement('div'); y.className='yourline fade'; y.textContent='your committed line · "'+v+'"';
    feed.appendChild(y);
    const det=DETECTORS[n&&n.beatname]; let readTxt=null;
    if(det){ const [tag,why]=det(v.toLowerCase());
      readTxt=tag+' — '+why;
      const rc=document.createElement('div'); rc.className='readchip fade';
      rc.innerHTML='<b>Read: '+tag+'.</b> '+why+' <span style="opacity:.55">(prototype detector — in-app: DetectorLocal, offline; typed line never touches the rating)</span>';
      feed.appendChild(rc); rc.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    S.record[nodeIdx]=S.record[nodeIdx]||{}; S.record[nodeIdx].typed=v; S.record[nodeIdx].read=readTxt;
    d.remove();
  };
  container.appendChild(d);
}
function renderPick(n){
  stage.innerHTML='';
  const ask=document.createElement('div'); ask.className='ask fade'; ask.textContent=n.ask; stage.appendChild(ask);
  typerFirst(stage, n);
  const box=document.createElement('div'); box.className='opts';
  n.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt'+(o.hold?' hold':''); b.textContent=o.t;
    b.onclick=()=>pick(n,o,i); box.appendChild(b);
  });
  stage.appendChild(box);
}
async function pick(n,o,i){
  ToneKit.play.tick();
  stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  if(o.flag) S.flags[o.flag]=true; if(o.scar) S.flags[o.scar]=true;
  if(n.beatname==='The close') S.lastBestForkable = !!(o.best && o.forkable);
  S.temp += o.ev>=0.3?1:(o.ev<=-0.5?-1:0); S.evs.push(o.ev);
  S.record[nodeIdx]=Object.assign(S.record[nodeIdx]||{},{node:n, opt:o, idx:i});
  stage.innerHTML='';
  await say(o.cont);
  nodeIdx++; setTimeout(runNode, 500);
}
async function renderMark(n){
  stage.innerHTML='';
  const ask=document.createElement('div'); ask.className='ask fade'; ask.textContent=n.ask; stage.appendChild(ask);
  const note=document.createElement('div'); note.className='tapnote fade'; note.textContent=n.tapnote; stage.appendChild(note);
  feed.classList.add('markable');
  const els=[];
  let pending=null;
  const arm=(el,c)=>{ el.onclick=()=>{
      if(pending&&pending.el===el) return;
      if(pending){ pending.el.classList.remove('provisional'); pending.chip.remove(); }
      ToneKit.play.tick();
      el.classList.add('provisional');
      const chip=document.createElement('div'); chip.className='confirm fade';
      chip.innerHTML='<button class="go">Come in here</button><button class="stay">Keep listening</button>';
      el.insertAdjacentElement('afterend', chip);
      pending={el, chip};
      chip.querySelector('.stay').onclick=()=>{ el.classList.remove('provisional'); chip.remove(); pending=null; };
      chip.querySelector('.go').onclick=()=>commit(el, c, chip);
      chip.scrollIntoView({block:'nearest',behavior:'smooth'});
    }; };
  for(const c of n.clauses){
    const t=bubble('buyer tappable', c.w, c.x, c.i); els.push({el:t, c});
    arm(t, c);                       // tappable the moment it renders — interrupting early is a legal move
    await sleep(1150);
  }
  async function commit(el, c, chip){
      chip.remove(); pending=null;
      feed.classList.remove('markable'); els.forEach(x=>{x.el.classList.remove('tappable','provisional'); x.el.onclick=null;});
      el.style.boxShadow='0 0 0 2px '+(c.key?'#81B64C':'#E5A50A');
      S.record[nodeIdx]={node:n, marked:c};
      if(c.key){
        stage.innerHTML='';
        const ask2=document.createElement('div'); ask2.className='ask fade'; ask2.textContent='You came in here. Your move:'; stage.appendChild(ask2);
        const box=document.createElement('div'); box.className='opts';
        c.opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=o.t;
          b.onclick=async ()=>{ box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
            if(o.flag) S.flags[o.flag]=true;
            S.temp += o.ev>=0.3?1:(o.ev<=-0.5?-1:0); S.evs.push(o.ev);
            S.record[nodeIdx].opt=o; S.record[nodeIdx].idx=i;
            stage.innerHTML='';
            await say(o.cont);
            nodeIdx++; setTimeout(runNode,500);
          }; box.appendChild(b); });
        stage.appendChild(box);
      } else {
        S.temp += c.ev<=-0.5?-1:0; S.evs.push(c.ev);
        S.record[nodeIdx].opt={ev:c.ev, room:c.room, t:'(interjected at: “'+c.x.slice(0,52)+'…”)'};
        stage.innerHTML='';
        await say(c.cont);
        beat('the conversation moves on — the migration clause goes past unbounded');
        S.flags.missedMigration=true;
        nodeIdx++; setTimeout(runNode,700);
      }
  }
}
function finish(){
  const e=ending();
  stage.innerHTML='';
  const card=document.createElement('div'); card.className='endcard fade '+e.cls;
  card.innerHTML='<div class="micro" style="margin-bottom:6px">call over</div>'+
    '<div class="e-title disp" style="color:'+V[e.v].c+'">'+e.title+'</div>'+
    (e.v==='fork'?'<div class="bar-cue"></div>':'')+
    '<div class="e-sub">'+e.sub+'</div>'+
    (e.teach?'<div class="e-teach">'+e.teach+'</div>':'')+
    '<button class="rb-btn">Read the call back</button>';
  stage.appendChild(card);
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(e.v==='fork'){
    // JUICE-DOCTRINE §5: anticipation → land alone → savor → replay the fronts → teach last
    card.classList.add('fork-anticipation');
    const antic=reduced?0:430;
    setTimeout(()=>{
      card.classList.remove('fork-anticipation'); card.classList.add('fork-land');
      const cue=card.querySelector('.bar-cue'); if(cue) cue.remove();
      ToneKit.play.fork();
      const savor=reduced?0:(520+180);
      setTimeout(()=>{
        const f1=card.querySelector('.f1'), f2=card.querySelector('.f2');
        if(f1) f1.classList.add('front-hi');
        setTimeout(()=>{ if(f2) f2.classList.add('front-hi');
          setTimeout(()=>{ const t=card.querySelector('.e-teach'); if(t) t.classList.add('shown'); }, 300);
        }, 120);
      }, savor);
    }, antic);
  } else {
    if(e.v==='tell'){ card.classList.add('endcard-heavy'); ToneKit.play.tell(); }
    else if(e.v==='best'){ ToneKit.play.best(); }
    else { ToneKit.play.routine(); }
    const t=card.querySelector('.e-teach'); if(t) t.classList.add('shown');
  }
  card.querySelector('.rb-btn').onclick=()=>{ renderReadback(e); };
}

/* ================= Read-Back ================= */
function renderReadback(e){
  const rb=document.getElementById('readback'); rb.style.display='block';
  // sparkline
  let x=0, y=32, pts='0,32'; const step=300/(S.evs.length||1);
  let acc=0;
  S.evs.forEach(ev=>{ acc+=ev; x+=step; y=32-acc*11; y=Math.max(6,Math.min(58,y)); pts+=' '+x.toFixed(0)+','+y.toFixed(0); });
  document.getElementById('sparksvg').innerHTML=
    '<polyline points="0,32 300,32" stroke="#3D3A37" stroke-width="1" fill="none"/>'+
    '<polyline points="'+pts+'" stroke="'+(acc>=1?'#81B64C':(acc<=-1?'#E5484D':'#E5A50A'))+'" stroke-width="2.5" fill="none" stroke-linejoin="round"/>';
  const wrap=document.getElementById('rbNodes'); wrap.innerHTML='';
  S.record.forEach((r,i)=>{
    if(!r||!r.node) return;
    const n=r.node, o=r.opt||{};
    const isBest=!!o.best, vk = (i===S.record.length-1 && e.v==='fork' && isBest) ? 'fork' : verdictFrom(o.ev??-0.4, isBest, false);
    const v=V[vk];
    const masterOpt = n.options ? n.options[n.master] : (r.marked&&r.marked.key ? r.marked.opts[0] : (n.clauses||[]).find(c=>c.key)?.opts?.[0]);
    const branches=(n.options||[]).filter((_,bi)=>bi!==r.idx).map(b=>'<div class="rb-branch"><b>'+(b.hold?'the hold':'“'+b.t.replace(/^"|"$/g,'').slice(0,90)+'…”')+'</b> — '+(b.room||'a line you didn’t play')+'</div>').join('');
    const div=document.createElement('div'); div.className='rb-node'+(vk==='fork'?' fork-hero':'')+((vk==='tell'||vk==='missed')?' land-heavy':'');
    div.dataset.vk=vk;
    div.innerHTML='<div class="rb-top"><div class="v-chip" style="background:'+v.c+'">'+v.g+'</div>'+
      '<div><div class="rb-beatname">'+n.beatname+'</div><div class="rb-label disp">'+v.label+'</div></div></div>'+
      '<div class="rb-yours"><b>You:</b> '+(o.t||'(no move recorded)').replace(/^"|"$/g,'')+(r.typed?'<br><b>Your typed line:</b> “'+r.typed.replace(/</g,'&lt;')+'”':'')+'</div>'+
      (r.read?'<div class="rb-read">'+r.read+'</div>':'')+
      (o.room||r.marked?.room ? '<div class="rb-room">'+(o.room||r.marked.room)+'</div>':'')+
      (masterOpt&&!isBest ? '<div class="rb-master">“'+masterOpt.t.replace(/^"|"$/g,'')+'”</div>':'')+
      (branches?'<details class="rb-branches"><summary>the lines you didn’t play</summary>'+branches+'</details>':'');
    wrap.appendChild(div);
  });
  // Land the verdicts one at a time — routine fast and near-silent, heavy slow, fork protected for the endcard
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  [...wrap.children].forEach((div,i)=>{
    const land=()=>{ div.classList.add('landed');
      const vk=div.dataset.vk;
      if(vk==='fork') ToneKit.play.sharp();      // the full fork sound already played on the endcard — keep it scarce
      else ToneKit.forVerdict(vk)();
    };
    if(reduced) land(); else setTimeout(land, 260*i+120);
  });
  rb.scrollIntoView({block:'start', behavior:'smooth'});
}
document.getElementById('dirToggle').onclick=function(){
  this.classList.toggle('on');
  document.body.classList.toggle('director', this.classList.contains('on'));
};

runNode();
</script>
