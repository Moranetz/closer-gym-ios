name: FrameFork
options:
  bundleIdPrefix: com.melmarion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: Q242KWQD56
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # Universal (iPhone+iPad) — this is what actually ships: xcodegen's target-level
    # default ("1,2") was overriding the old project-level "1", and the store listing
    # already carries iPad screenshots. Declared at target level below so the yml and
    # the generated project can no longer diverge. (ENABLE_HARDENED_RUNTIME removed:
    # macOS-only, a no-op on iOS that read like a working security control.)
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  FrameFork:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FrameFork
        excludes:
          - "**/.DS_Store"
    info:
      path: FrameFork/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: BgPage
        CFBundleDisplayName: Frame & Fork
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melmarion.FrameFork
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandGreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIRequiresFullScreen: false
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  FrameForkUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FrameForkUITests
    dependencies:
      - target: FrameFork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melmarion.FrameForkUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
  FrameForkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FrameForkTests
    dependencies:
      - target: FrameFork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melmarion.FrameForkTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
schemes:
  FrameFork:
    build:
      targets:
        FrameFork: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Pro.storekit
    test:
      config: Debug
      targets:
        - FrameForkTests
        - FrameForkUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
